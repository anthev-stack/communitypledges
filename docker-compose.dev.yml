# Local PostgreSQL for development. Start with: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: commpledges-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: commpledges
      POSTGRES_PASSWORD: commpledges
      POSTGRES_DB: commpledges
    volumes:
      - commpledges_pgdata:/var/lib/postgresql/data

volumes:
  commpledges_pgdata:
